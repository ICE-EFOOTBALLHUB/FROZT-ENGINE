name: FROZT N2 - Step 1 - Android Asset Loading

on:
  workflow_dispatch:

jobs:
  step1:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract N1 package
        run: |
          rm -rf n1_extracted
          mkdir n1_extracted
          unzip -q "Frozt_N1_First_Native_Playable_Preparation_Locked_v1.0.zip" -d n1_extracted

      - name: Implement Android asset loading
        run: |
          python3 <<'PY'
          from pathlib import Path

          root = Path("n1_extracted/f9_release")
          jni = root / "android/app/src/main/cpp/frozt_android_jni.c"

          s = jni.read_text()

          # Add Android asset-manager header if it is missing.
          if "#include <android/asset_manager_jni.h>" not in s:
              marker = "#include <jni.h>"
              if marker not in s:
                  raise SystemExit("Could not find jni.h include")
              s = s.replace(
                  marker,
                  marker + "\n#include <android/asset_manager_jni.h>"
              )

          # Find nativeStart and inspect its existing signature.
          start = s.find("nativeStart")
          if start == -1:
              raise SystemExit("nativeStart was not found")

          print("===== EXISTING nativeStart =====")
          print(s[max(0, start - 300):start + 1800])

          jni.write_text(s)
          PY

      - name: Inspect Android JNI source
        run: |
          echo "===== frozt_android_jni.c ====="
          cat n1_extracted/f9_release/android/app/src/main/cpp/frozt_android_jni.c

      - name: Build current Android project
        run: |
          cd n1_extracted/f9_release/android
          gradle --no-daemon --console=plain --stacktrace assembleDebug

      - name: Locate APK
        run: |
          find n1_extracted/f9_release/android \
            -type f \
            -name "*.apk" \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frozt-n2-step1-asset-load-apk
          path: n1_extracted/f9_release/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
